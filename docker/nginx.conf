server {
    listen       80;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    # nginx 1.27's bundled mime.types already maps .wasm -> application/wasm and
    # .json -> application/json; .dat and other Blazor assets fall back to the
    # default octet-stream, which browsers accept.

    # On-the-fly compression for the text-y assets (the .br/.gz siblings emitted
    # by `dotnet publish` are ignored — the stock image has no *_static modules).
    gzip              on;
    gzip_types        text/plain text/css application/javascript application/wasm application/json image/svg+xml;
    gzip_min_length   1024;

    # SPA fallback: unknown routes are client-side routes, so serve index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # The entry document pins the fingerprinted asset URLs and the runtime config
    # carries API_BASE_URL, so neither may be cached — a redeploy or a config
    # change must take effect immediately. (.NET 10 embeds the old blazor.boot.json
    # into dotnet.js, so there is no separate boot manifest to guard.)
    location = /index.html {
        add_header Cache-Control "no-store";
    }
    location = /appsettings.json {
        add_header Cache-Control "no-store";
    }

    # Framework assets carry content-hash fingerprints in their names, so they are
    # safe to cache forever; a new build ships new names.
    location /_framework/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
